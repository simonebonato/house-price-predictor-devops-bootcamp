name: MLOps CI

on:
  workflow_dispatch: 
    inputs: 
      run_all:
        description: "Run the entire pipeline"
        required: false
        default: "true"

jobs:
    run_all:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11.5"

            - name: Install dependencies
              run: |
                pip install uv
                uv pip install --system -r requirements.txt
            - name: Data Processing
              run: python src/data/run_processing.py   --input data/raw/house_data.csv   --output data/processed/cleaned_house_data.csv 
            
            - name: Feature Engineering
              run: python src/features/engineer.py   --input data/processed/cleaned_house_data.csv   --output data/processed/featured_house_data.csv   --preprocessor models/trained/preprocessor.pkl

            - name: Start MLFlow
              uses: hoverkraft-tech/compose-action@v2.4.3
              with: 
                compose-file: deployment/mlflow/docker-compose.yaml
                up-flags: "-d"
                
            - name: Model Training
              run: python src/models/train_model.py   --config configs/model_config.yaml   --data data/processed/featured_house_data.csv   --models-dir models   --mlflow-tracking-uri http://localhost:5555

            - name: Stop MLFlow
              run: docker compose -f deployment/mlflow/docker-compose.yaml down

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Compute next version tag
              id: version
              run: |
                # Fetch all tags from one of the images (fastapi) and find the latest v.1.N
                TAGS=$(curl -s "https://hub.docker.com/v2/repositories/pippa99/fastapi/tags/?page_size=100" \
                  | python3 -c "
                import sys, json, re
                data = json.load(sys.stdin)
                results = data.get('results', [])
                ns = [int(m.group(1)) for t in results for m in [re.match(r'^v\.1\.(\d+)$', t['name'])] if m]
                print(max(ns) if ns else -1)
                ")
                NEXT=$((TAGS + 1))
                echo "tag=v.1.${NEXT}" >> "$GITHUB_OUTPUT"

            - name: Build and push mlflow
              uses: docker/build-push-action@v6
              with:
                push: true
                tags: pippa99/mlflow:${{ steps.version.outputs.tag }}
                context: "."
                file: Dockerfile

            - name: Build and push streamlit
              uses: docker/build-push-action@v6
              with:
                push: true
                tags: pippa99/streamlit:${{ steps.version.outputs.tag }}
                context: "."
                file: streamlit_app/Dockerfile

            - name: Build and push fastapi
              uses: docker/build-push-action@v6
              with:
                push: true
                tags: pippa99/fastapi:${{ steps.version.outputs.tag }}
                context: "."
                file: Dockerfile
